<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Bilet do kalendarza</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f6f7; --fg: #1d1d1f; --muted: #6e6e73; --accent: #1c7ed6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1c1e; --fg: #f5f5f7; --muted: #a1a1a6; --accent: #4dabf7; }
  }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 480px; margin: 0 auto; padding: 48px 16px; }
  h1 { font-size: 22px; line-height: 1.25; margin: 0 0 8px; overflow-wrap: anywhere; }
  p { margin: 0 0 8px; color: var(--muted); overflow-wrap: anywhere; }
  a.button { display: block; margin: 24px 0 12px; padding: 14px; border-radius: 12px;
             background: var(--accent); color: #fff; font-weight: 600; text-align: center;
             text-decoration: none; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1 id="title">Bilet do kalendarza</h1>
  <p id="when"></p>
  <p id="place"></p>
  <a id="open" class="button" hidden>Dodaj do kalendarza</a>
  <p id="note"></p>
</main>
<script>
  // Dane eventu są po „#”, więc przeglądarka nie wysyła ich na serwer.
  // Nazwa musi się zgadzać z nazwą skrótu na iPhonie (docs/skrot-ios.md).
  var SHORTCUT = "EventScout Bilet";
  var TIME = /^\d{4}-\d{2}-\d{2} \d{2}:\d{2}$/;

  var params = new URLSearchParams(location.hash.slice(1));
  var event = {
    title: params.get("t") || "",
    start: params.get("s") || "",
    end: params.get("e") || "",
    place: params.get("p") || "",
    url: params.get("u") || ""
  };
  if (!/^https?:\/\//.test(event.url)) event.url = "";

  var note = document.getElementById("note");
  if (!event.title || !TIME.test(event.start) || !TIME.test(event.end)) {
    note.textContent = "Ten link jest niepełny. Otwórz go jeszcze raz z karty na Discordzie.";
  } else {
    document.getElementById("title").textContent = event.title;
    document.getElementById("when").textContent = event.start;
    document.getElementById("place").textContent = event.place;
    var target = "shortcuts://run-shortcut?name=" + encodeURIComponent(SHORTCUT) +
      "&input=text&text=" + encodeURIComponent(JSON.stringify(event));
    var button = document.getElementById("open");
    button.href = target;
    button.hidden = false;
    note.textContent = "Skrót powinien otworzyć się sam. Jeśli nie, naciśnij przycisk.";
    location.href = target;
  }
</script>
</body>
</html>
